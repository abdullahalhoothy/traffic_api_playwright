version: "3.9"

services:
  api:
    build: .
    container_name: traffic_api
    network_mode: "host"
    shm_size: "2gb"
    restart: unless-stopped
    
    # Resource limits to prevent OOM on the host
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          memory: 4G
    
    # Logging rotation to prevent disk exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    environment:
      - SQLITE_DB_FILE=/app/data/traffic.db
      - JWT_SECRET=${JWT_SECRET:-jwt_secret}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
      - RATE_LIMIT=${RATE_LIMIT:-10/minute}
      - PLAYWRIGHT_PROXY_SERVER=${PLAYWRIGHT_PROXY_SERVER:-}
      - PLAYWRIGHT_PROXY_BYPASS=${PLAYWRIGHT_PROXY_BYPASS:-}
      - PLAYWRIGHT_PROXY_USERNAME=${PLAYWRIGHT_PROXY_USERNAME:-}
      - PLAYWRIGHT_PROXY_PASSWORD=${PLAYWRIGHT_PROXY_PASSWORD:-}
      - PORT=8000
      - PYTHONUNBUFFERED=1

    volumes:
      - ./static:/app/static
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
